name: Feature request
description: Propose an improvement or new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What user or team problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - Nice to have
        - Should have soon
        - Blocking for a release / customer
    validations:
      required: false
